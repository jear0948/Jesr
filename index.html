const $=s=>document.querySelector(s),r0=Math.round,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function chart(vals,labels,goal,fmt){const w=320,h=110,n=vals.length,mx=Math.max(...vals,goal||0,1),bw=w/n;let s=`<svg class=ch viewBox="0 0 ${w} ${h+16}" role="img" aria-label="Bar chart">`;
vals.forEach((v,i)=>{const hh=v/mx*h;s+=`<rect x="${i*bw+bw*.15}" y="${h-hh}" width="${bw*.7}" height="${hh}" rx="2" style="fill:var(--ac)"><title>${labels[i]}: ${fmt?fmt(v):r0(v)}</title></rect>`;if(n<=7||i%5===0||i===n-1)s+=`<text x="${i*bw+bw/2}" y="${h+12}">${labels[i]}</text>`});
if(goal)s+=`<line x1="0" x2="${w}" y1="${h-goal/mx*h}" y2="${h-goal/mx*h}" style="stroke:var(--ink)" stroke-dasharray="3 3" opacity=".5"/>`;return s+'</svg>'}
function render(){const nv=$('#nav'),setup=!DB.pf||editP;nv.style.display=setup?'none':'';if(setup){document.body.dataset.tab='today';$('#app').innerHTML=vSetup();return}document.body.dataset.tab=tab;
$('#nav').innerHTML=[['today','Today'],['food','Food'],['lift','Workout'],['move','Move'],['body','Body'],['stats','Stats']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');

const net=logged.length?r0(sum(ds.filter((d,i)=>fs[i].k>0),d=>dayFood(d).k-burned(d))/L):0;
const allRuns=DB.mv.filter(x=>x.ty==='run'&&x.km>=1),best=allRuns.length?Math.min(...allRuns.map(x=>x.sec/x.km)):0;
const pr={};DB.wk.forEach(w=>w.ex.forEach(e=>e.sets.forEach(s=>{const k=e.n.toLowerCase();if(!pr[k]||s.k>pr[k].k||(s.k===pr[k].k&&s.r>pr[k].r))pr[k]={n:e.n,k:s.k,r:s.r}})));
const prs=Object.values(pr).sort((a,b)=>b.k-a.k).slice(0,6);
return `<h1>Stats</h1><div class=seg style="margin-bottom:12px"><button class="${sr===7?'on':''}" onclick="sr=7;render()">7 days</button><button class="${sr===30?'on':''}" onclick="sr=30;render()">30 days</button></div>
<h2>Food</h2><div class=card>${logged.length?`<div class=lab>Calories per day (dashed line is your goal)</div>${chart(fs.map(x=>x.k),lb,DB.g.kcal)}`:'<p class=note style="margin:0">No food logged in this period.</p>'}</div>
<div class=tiles>${tile('avg kcal per logged day',avg(x=>x.k))}${tile('avg net kcal (eaten − burned)',net)}${tile('avg protein (g)',avg(x=>x.p))}${tile('avg carbs / fat (g)',avg(x=>x.c)+' / '+avg(x=>x.f))}</div>
<h2>Walking and running</h2><div class=card style="--ac:var(--ember)"><div class=lab>Distance per day (km)</div>${chart(ds.map(km),lb,0,v=>v.toFixed(2)+' km')}</div>
<div class=tiles>${tile('total km',sum(mv,x=>x.km).toFixed(1))}${tile('time moving',mmss(sum(mv,x=>x.sec)))}${tile('avg run pace',pace(sum(runs,x=>x.sec),sum(runs,x=>x.km)))}${tile('best run pace (1 km+)',best?mmss(best)+' /km':'–')}${tile('run km / walk km',sum(runs,x=>x.km).toFixed(1)+' / '+sum(walks,x=>x.km).toFixed(1))}${tile('longest run / walk km',Math.max(0,...runs.map(x=>x.km)).toFixed(1)+' / '+Math.max(0,...walks.map(x=>x.km)).toFixed(1))}</div>
<h2>Lifting</h2><div class=card style="--ac:var(--sky)"><div class=lab>Workout minutes per day</div>${chart(ds.map(d=>sum(wk.filter(x=>x.d===d),x=>x.dur)/60),lb,0,v=>r0(v)+' min')}</div>
<div class=tiles>${tile('workouts',wk.length)}${tile('total time',mmss(sum(wk,x=>x.dur)))}${tile('time resting',mmss(sum(wk,x=>x.rest)))}${tile('volume (kg)',r0(sum(wk,x=>x.vol)).toLocaleString())}</div>
<div class=card><b>Heaviest sets (all time)</b>${prs.length?prs.map(p=>`<div class="item row"><span>${esc(p.n)}</span><span>${p.k?p.k+' kg × ':''}${p.r}${p.k?'':' reps'}</span></div>`).join(''):'<p class=note>Log a workout to see records.</p>'}</div>
<h2>Calories burned</h2><div class=card style="--ac:var(--ember)">${chart(ds.map(burned),lb,0,v=>r0(v)+' kcal')}<p class=note>Total ${r0(sum(ds,burned))} kcal (estimated from your body weight).</p></div>`}
setInterval(()=>{const n=Date.now();
if(W){if(W.restEnd&&n>=W.restEnd){W.restTotal+=W.restEnd-W.restStart;W.restEnd=null;saveW();beep()}
const a=$('#wt'),b=$('#rt'),s=$('#skip');if(a)a.textContent=W.start?mmss((n-W.start)/1000):'0:00';if(b){b.textContent=W.restEnd?mmss(Math.ceil((W.restEnd-n)/1000)):'Go';b.parentElement.classList.toggle('on',!!W.restEnd)}if(s)s.hidden=!W.restEnd}
if(M)updM()},250);
render();
</script></body></html>
